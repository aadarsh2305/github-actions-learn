
name: Secret Practice

on:
  workflow_dispatch:

jobs:
  secret-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret availability
        env:
          DEMO_TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -n "$DEMO_TOKEN" ]; then
            echo "Secret is configured"
          else
            echo "Secret is missing"
            exit 1
          fi
