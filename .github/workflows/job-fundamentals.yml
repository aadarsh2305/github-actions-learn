
name: Job Fundamentals

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lint message
        run: echo "Lint completed"

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test message
        run: echo "Tests completed"

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Deploy message
        run: echo "Deployment started"
