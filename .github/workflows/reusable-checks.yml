
name: Reusable Checks

on:
  workflow_call:
    inputs:
      app_name:
        description: Application name
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Print application
        env:
          APP_NAME: ${{ inputs.app_name }}
        run: echo "Validating $APP_NAME"

      - name: Check runner
        run: echo "Reusable workflow executed"
